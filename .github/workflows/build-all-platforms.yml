name: Multi-Platform Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # 1. Web 静态网站与 PWA 打包
  # ----------------------------------------------------
  build-web:
    name: Build Web (Static & PWA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web application
        run: pnpm build

      - name: Archive Web build artifacts
        run: |
          mkdir -p release-web
          cd dist
          tar -czf ../release-web/word-guess-assistant-web.tar.gz .
          zip -r -q ../release-web/word-guess-assistant-web.zip .

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: word-guess-assistant-web
          path: release-web/*

  # ----------------------------------------------------
  # 2. Linux 原生构建 (DEB / AppImage / Binary)
  # ----------------------------------------------------
  build-linux:
    name: Build Linux (x86_64 AppImage / DEB)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler \
            patchelf \
            desktop-file-utils \
            libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Linux App (Binary & DEB)
        run: pnpm tauri build --bundles deb

      - name: Bundle AppImage (Optional)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: pnpm tauri bundle --bundles appimage || true

      - name: Collect Linux release files
        run: |
          mkdir -p release-linux
          cp -f src-tauri/target/release/word-guess-assistant release-linux/word-guess-assistant-linux-x86_64
          cp -rf src-tauri/target/release/bundle/deb/*.deb release-linux/ 2>/dev/null || true
          cp -rf src-tauri/target/release/bundle/appimage/*.AppImage release-linux/ 2>/dev/null || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: word-guess-assistant-linux
          path: release-linux/*

  # ----------------------------------------------------
  # 3. Windows 原生构建 (NSIS / WiX MSI / Portable EXE)
  # ----------------------------------------------------
  build-windows:
    name: Build Windows (x86_64 EXE / MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protocol Buffers compiler (protoc)
        run: choco install protoc --no-progress -y

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Windows App
        run: pnpm tauri build --bundles nsis,msi

      - name: Collect Windows release files
        shell: bash
        run: |
          mkdir -p release-windows
          cp -f src-tauri/target/release/word-guess-assistant.exe release-windows/word-guess-assistant-portable.exe
          cp -rf src-tauri/target/release/bundle/nsis/*.exe release-windows/ 2>/dev/null || true
          cp -rf src-tauri/target/release/bundle/msi/*.msi release-windows/ 2>/dev/null || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: word-guess-assistant-windows
          path: release-windows/*

  # ----------------------------------------------------
  # 4. Android 平台构建 (APK / AAB)
  # ----------------------------------------------------
  build-android:
    name: Build Android (APK / AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
          EXISTING_NDK=$(ls -1d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$EXISTING_NDK" ]; then
            "$SDKMANAGER" --install "ndk;27.0.12077973"
            EXISTING_NDK="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "Using NDK: $EXISTING_NDK"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$EXISTING_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$EXISTING_NDK" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: pnpm tauri android build --apk --target aarch64 --ci

      - name: Collect Android release files
        run: |
          mkdir -p release-android
          find src-tauri/gen/android/app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp -f {} release-android/ \;
          ls -lh release-android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: word-guess-assistant-android
          path: release-android/*

  # ----------------------------------------------------
  # 5. GitHub Release 全平台发布归档
  # ----------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-web, build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Artifacts
        uses: actions/download-artifact@v4
        with:
          name: word-guess-assistant-web
          path: all-releases/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: word-guess-assistant-linux
          path: all-releases/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: word-guess-assistant-windows
          path: all-releases/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: word-guess-assistant-android
          path: all-releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-releases/*
          generate_release_notes: true
